name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  application:
    name: Compilation et tests iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer XcodeGen
        run: brew install xcodegen

      # Le projet est régénéré depuis project.yml, qui reste la source de vérité.
      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler et tester
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]] | first | .udid')
          xcodebuild \
            -project DuoScribo.xcodeproj \
            -scheme DuoScribo \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
